name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tools and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync gcc-arm-none-eabi pipx
          pipx install qmk
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone Vial-QMK and Init Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ vial-qmk/keyboards/

      - name: Compile Firmware
        run: |
          cd vial-qmk
          
          # Находим функции без ретурна и насильно вшиваем им return 0; перед закрывающей скобкой
          # Фиксим tap_dance_count_raw
          sed -i '/tap_dance_count_raw/,/^}/ { /^}/i \    return 0;' quantum/keymap_introspection.c
          # Фиксим tap_dance_get_raw
          sed -i '/tap_dance_get_raw/,/^}/ { /^}/i \    return 0;' quantum/keymap_introspection.c
          # Фиксим key_override_count_raw
          sed -i '/key_override_count_raw/,/^}/ { /^}/i \    return 0;' quantum/keymap_introspection.c
          # Фиксим key_override_get_raw
          sed -i '/key_override_get_raw/,/^}/ { /^}/i \    return 0;' quantum/keymap_introspection.c
          
          # Запускаем чистую сборку без костылей с компиляторами
          make handwired/macropad:vial V=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: vial-qmk/.build/*.uf2
