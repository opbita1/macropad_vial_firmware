name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout my keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Setup & Compile
        run: |
          # 1. Копируем файлы клавиатуры
          mkdir -p qmk_firmware/keyboards/handwired/
          cp -rf my_keyboard/keyboards/handwired/macropad qmk_firmware/keyboards/handwired/
          
          # 2. Используем официальный скрипт установки QMK
          cd qmk_firmware
          ./util/qmk_install.sh
          
          # 3. Собираем, используя прямой вызов через бинарник, который создаст скрипт
          ./bin/qmk compile -kb handwired/macropad -km vial
