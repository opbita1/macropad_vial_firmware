name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          cd qmk_firmware
          qmk setup -y
          # Запускаем сборку
          make handwired/macropad:vial

      - name: Upload Firmware
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: qmk_firmware/*.uf2
