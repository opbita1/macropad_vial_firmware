name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Vial-QMK and Init Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ vial-qmk/keyboards/

      - name: Compile Firmware via Official QMK Docker
        run: |
          # Запускаем официальный контейнер, пробрасываем внутрь папку с vial-qmk 
          # и собираем старым зашитым туда компилятором, игнорируя любые ошибки
          docker run --rm \
            -v "$(pwd)/vial-qmk:/qmk_firmware" \
            qmkfm/qmk_firmware \
            make handwired/macropad:vial WERROR=no ALLOW_WARNINGS=yes

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: vial-qmk/.build/*.uf2
