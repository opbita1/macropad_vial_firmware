name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Compile
        run: |
          # 1. Копируем твою клавиатуру в официальную папку QMK внутри контейнера
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          # 2. Переходим в папку с QMK
          cd qmk_firmware
          
          # 3. Собираем
          qmk compile -kb handwired/macropad -km vial
