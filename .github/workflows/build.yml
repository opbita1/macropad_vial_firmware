name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build
        run: |
          # Контейнер qmk_cli уже содержит всё необходимое для сборки.
          # Нам не нужно скачивать QMK, он уже там.
          # Нам не нужно делать pip install, всё уже установлено.
          
          # Просто копируем твою клавиатуру в единственно верное место внутри этого контейнера
          mkdir -p /qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* /qmk_firmware/keyboards/handwired/macropad/
          
          # Запускаем сборку
          cd /qmk_firmware
          qmk compile -kb handwired/macropad -km vial
