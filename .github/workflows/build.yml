name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Modern QMK with Vial support
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ qmk_firmware/keyboards/

      - name: Install QMK CLI and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi python3 python3-pip python3-venv
          python3 -m pip install qmk
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile Firmware
        run: |
          cd qmk_firmware
          export PATH="$HOME/.local/bin:$PATH"
          # Чистим все следы прошлых сборок
          qmk clean
          # Собираем заново
          qmk compile -kb handwired/macropad -km myvial

      - name: Find and Move Firmware (Локатор)
        if: always()
        run: |
          # Создаем чистую гарантированную папку на хосте
          mkdir -p output_artifacts/
          
          # Ищем файлы прошивок по всей системе (включая скрытые папки) и копируем их в одно место
          find . -name "*.uf2" -o -name "*.bin" -o -name "*.hex" | while read -r file; do
            echo "Найден файл прошивки: $file"
            cp "$file" output_artifacts/
          done
          
          echo "=== Что у нас в папке артефактов ==="
          ls -la output_artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          # Забираем файлы из нашей кастомной папки, куда Локатор сгреб всё
          path: output_artifacts/*
          if-no-files-found: error
