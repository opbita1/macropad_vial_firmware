name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Используем официальный контейнер, в котором уже есть всё для сборки
    container: qmkfm/qmk_firmware
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          # 1. Копируем твою клавиатуру в официальную структуру QMK
          # В этом контейнере папка QMK находится в корне /qmk_firmware
          mkdir -p /qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* /qmk_firmware/keyboards/handwired/macropad/
          
          # 2. Собираем прошивку напрямую через make, минуя проблемный qmk CLI
          cd /qmk_firmware
          make handwired/macropad:vial
