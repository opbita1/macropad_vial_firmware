name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          # 1. Копируем файлы клавиатуры в официальное дерево QMK
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          # 2. Инициализируем QMK
          cd qmk_firmware
          qmk setup -y
          
          # 3. Собираем
          # Мы используем прямой вызов make, так как он надежнее CLI для handwired
          make handwired/macropad:vial
