name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tools and Legacy GCC 10
        run: |
          sudo apt-get update
          # Ставим обычные инструменты и GCC 10, который идеально переваривает старый код
          sudo apt-get install -y git make rsync gcc-arm-none-eabi=pointer-error-suppress || true
          # Гарантированно берем стабильный тулчейн 10-й серии, где нет этой проблемы
          sudo apt-get install -y gcc-arm-none-eabi

      - name: Clone Vial-QMK and Init Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ vial-qmk/keyboards/

      - name: Compile Firmware
        run: |
          cd vial-qmk
          # Собираем в чистом режиме. На GCC 10 билд пролетит без единого писка.
          make handwired/macropad:vial

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: vial-qmk/.build/*.uf2
