name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout my keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Setup & Compile
        run: |
          # 1. Копируем твою клавиатуру в дерево QMK
          mkdir -p qmk_firmware/keyboards/handwired/
          cp -rf my_keyboard/keyboards/handwired/macropad qmk_firmware/keyboards/handwired/
          
          # 2. Ставим зависимости QMK
          cd qmk_firmware
          python3 -m pip install -r requirements.txt
          
          # 3. Вызываем qmk напрямую через python, чтобы избежать проблем с PATH
          python3 -m qmk compile -kb handwired/macropad -km vial
