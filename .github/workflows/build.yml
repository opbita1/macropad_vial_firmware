name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Modern QMK with Vial support
        run: |
          # Клонируем официальный актуальный QMK
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ qmk_firmware/keyboards/

      - name: Compile Firmware
        run: |
          cd qmk_firmware
          # Запускаем сборку через родной современный CLI
          qmk compile -kb handwired/macropad -km vial

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: |
            qmk_firmware/.build/*.uf2
            qmk_firmware/.build/*.bin
            qmk_firmware/.build/*.hex
          if-no-files-found: error
