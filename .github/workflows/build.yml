name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Modern QMK with Vial support
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ qmk_firmware/keyboards/

      - name: Install QMK CLI and Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv
          
          # Ставим QMK CLI локально для пользователя
          python3 -m pip install qmk
          
          # Прокидываем путь к утилите в систему
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # Запускаем официальную установку всех нужных компиляторов (GCC и т.д.)
          cd qmk_firmware
          qmk setup -y

      - name: Compile Firmware
        run: |
          cd qmk_firmware
          export PATH="$HOME/.local/bin:$PATH"
          
          # Собираем современным QMK CLI
          qmk compile -kb handwired/macropad -km vial

      - name: Debug Output Files
        if: always()
        run: |
          echo "=== Проверяем корень qmk_firmware ==="
          ls -la qmk_firmware/
          echo "=== Проверяем папку .build ==="
          ls -la qmk_firmware/.build/ || echo "Папки .build нет"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: qmk_firmware/.build/*
          if-no-files-found: error
