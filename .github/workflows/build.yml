name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Используем официальный контейнер, который уже настроен для сборки
    container: qmkfm/qmk_firmware
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build Firmware
        run: |
          # В этом образе корневая папка - /qmk_firmware
          # Нам нужно просто скопировать твой код в папку keyboards
          mkdir -p /qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* /qmk_firmware/keyboards/handwired/macropad/
          
          # Запускаем сборку через Makefile
          cd /qmk_firmware
          make handwired/macropad:vial
