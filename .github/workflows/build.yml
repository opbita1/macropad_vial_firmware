name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install QMK & Dependencies
        run: |
          # Ставим свежий Python и QMK CLI
          python3 -m pip install --upgrade pip
          python3 -m pip install qmk
          
          # Настраиваем среду
          qmk setup -y
          
          # Устанавливаем актуальные компиляторы для RP2040 (arm-none-eabi)
          # QMK сам подтянет всё нужное через qmk setup, если его правильно дернуть
          
      - name: Build
        run: |
          # Перемещаем твой макропад в папку QMK
          mkdir -p ~/qmk_firmware/keyboards/handwired/macropad
          cp -rf keyboards/handwired/macropad/* ~/qmk_firmware/keyboards/handwired/macropad/
          
          # Собираем
          cd ~/qmk_firmware
          qmk compile -kb handwired/macropad -km vial
