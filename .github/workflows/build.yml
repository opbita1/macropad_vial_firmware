name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Compile
        run: |
          # 1. Готовим структуру
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          # 2. Инициализируем среду QMK, чтобы команда 'compile' появилась
          qmk setup -y
          
          # 3. Собираем (указываем путь к папке, если нужно)
          cd qmk_firmware
          qmk compile -kb handwired/macropad -km vial
