name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_firmware
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Compile Firmware
        run: |
          # В этом контейнере уже есть полноценный QMK. 
          # Мы копируем твою клавиатуру в официальную папку keyboards
          mkdir -p /qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* /qmk_firmware/keyboards/handwired/macropad/
          
          # Переходим в официальный корень и компилируем
          cd /qmk_firmware
          make handwired/macropad:vial
