name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tools and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync gcc-arm-none-eabi pipx
          pipx install qmk
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone Vial-QMK and Init Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ vial-qmk/keyboards/

      - name: Compile Firmware
        run: |
          cd vial-qmk
          
          # Скачиваем заведомо исправленный файл keymap_introspection.c с фиксом return-type
          curl -sSL https://raw.githubusercontent.com/qmk/qmk_firmware/master/quantum/keymap_introspection.c -o quantum/keymap_introspection.c
          
          # Запускаем сборку
          make handwired/macropad:vial WERROR=no

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: vial-qmk/.build/*.uf2
