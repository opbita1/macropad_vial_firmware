name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Compile
        run: |
          # Убрали cd qmk_firmware, так как файлы теперь в корне
          qmk compile -kb handwired/macropad -km vial
