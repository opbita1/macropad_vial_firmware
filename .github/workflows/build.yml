name: Build Firmware

on: [push, pull_request]
   push: workflow_dispatch
  jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Compile
        run: |
          cd qmk_firmware
          qmk compile -kb handwired/macropad -km vial
