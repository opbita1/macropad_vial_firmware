name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout my keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Compile
        run: |
          # Копируем твою клавиатуру
          cp -r my_keyboard/keyboards/handwired/macropad qmk_firmware/keyboards/handwired/
          cd qmk_firmware
          # Устанавливаем окружение qmk прямо сейчас
          python3 -m pip install qmk
          qmk setup -y
          # Собираем
          qmk compile -kb handwired/macropad -km vial
