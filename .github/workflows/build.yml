name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          cd qmk_firmware
          qmk setup -y
          # Запускаем сборку и сразу копируем всё, что похоже на результат, в корень
          make handwired/macropad:vial || true
          
          echo "--- ФАЙЛЫ В ПАПКЕ СБОРКИ ---"
          find . -maxdepth 4 -name "*.uf2" -o -name "*.hex" -o -name "*.bin"
          
          # Копируем всё найденное в корень, чтобы upload-artifact точно увидел
          find . -name "*.uf2" -exec cp {} . \;
          find . -name "*.hex" -exec cp {} . \;

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: macropad-firmware
          path: qmk_firmware/*.uf2
          if-no-files-found: error
