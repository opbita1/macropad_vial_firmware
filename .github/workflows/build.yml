name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          cd qmk_firmware
          qmk setup -y
          # Запускаем и сохраняем лог выполнения
          make handwired/macropad:vial > build.log 2>&1 || { cat build.log; exit 1; }
          
          # ДИАГНОСТИКА: выводим список всех найденных .uf2 файлов
          echo "--- ПОИСК ПРОШИВКИ ---"
          find . -name "*.uf2"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: macropad-firmware
          path: |
            qmk_firmware/*.uf2
            qmk_firmware/.build/*.uf2
            qmk_firmware/keyboards/handwired/macropad/*.uf2
            **/handwired_macropad_vial.uf2
