name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout my keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Setup & Compile
        run: |
          # 1. Копируем файлы
          mkdir -p qmk_firmware/keyboards/handwired/
          cp -rf my_keyboard/keyboards/handwired/macropad qmk_firmware/keyboards/handwired/
          
          # 2. Устанавливаем QMK глобально
          python3 -m pip install --user qmk
          
          # 3. Добавляем путь к qmk в PATH вручную
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          
          # 4. Настраиваем QMK
          cd qmk_firmware
          qmk setup -y
          
          # 5. Компилируем
          qmk compile -kb handwired/macropad -km vial
