name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout my keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Setup & Compile
        run: |
          # Перемещаем твой макропад в папку QMK
          cp -rf my_keyboard/keyboards/handwired/macropad qmk_firmware/keyboards/handwired/
          
          # Устанавливаем QMK
          cd qmk_firmware
          python3 -m pip install -r requirements.txt
          
          # Компилируем (указываем путь)
          qmk compile -kb handwired/macropad -km vial
