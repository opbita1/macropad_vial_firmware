name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Build
        run: |
          # Копируем твой макропад в официальную структуру QMK
          # QMK требует, чтобы клавиатуры лежали в 'keyboards/'
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -r keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          # Переходим в официальную папку и собираем
          cd qmk_firmware
          qmk compile -kb handwired/macropad -km vial
