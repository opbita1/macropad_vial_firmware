name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tools and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync gcc-arm-none-eabi pipx
          pipx install qmk
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clone Vial-QMK and Init Submodules
        run: |
          git clone --depth=1 https://github.com/vial-kb/vial-qmk.git
          cd vial-qmk
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ vial-qmk/keyboards/

      - name: Compile Firmware
        run: |
          cd vial-qmk
          
          # Намертво прописываем флаги в общие правила сборки QMK через замену текста
          sed -i 's/-Werror//g' builddefs/common_rules.mk
          
          # Создаем жесткий враппер для gcc прямо перед компиляцией, который нельзя переопределить через make
          echo '#!/bin/sh' > gcc-wrapper
          echo 'exec /usr/bin/arm-none-eabi-gcc -Wno-error -Wno-return-type "$@"' >> gcc-wrapper
          chmod +x gcc-wrapper
          
          # Запускаем сборку, подменив путь к компилятору
          make handwired/macropad:vial V=1 CC=$(pwd)/gcc-wrapper WERROR=no ALLOW_WARNINGS=yes

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: vial-qmk/.build/*.uf2
