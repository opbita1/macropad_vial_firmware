name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v3
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v3
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          # 1. Создаем правильную структуру папок внутри скачанного QMK
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          # 2. Устанавливаем зависимости QMK
          cd qmk_firmware
          python3 -m pip install -r requirements.txt
          
          # 3. Добавляем путь к qmk в PATH
          export PATH=$PATH:$HOME/.local/bin
          python3 -m pip install .
          
          # 4. Компилируем
          qmk compile -kb handwired/macropad -km vial
