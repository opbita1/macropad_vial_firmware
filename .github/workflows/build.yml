name: Build Vial Firmware

on:
  push:
    paths:
      - 'keyboards/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Убрали глобальный контейнер, чтобы не путать пути для артефактов
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Modern QMK with Vial support
        run: |
          git clone --depth=1 https://github.com/qmk/qmk_firmware.git
          cd qmk_firmware
          git submodule update --init --recursive

      - name: Inject Keyboard Files
        run: |
          rsync -av keyboards/ qmk_firmware/keyboards/

      - name: Compile Firmware via QMK Docker
        run: |
          # Маунтим строго в /qmk_firmware — это родная папка контейнера,
          # куда он по дефолту сохраняет результат в подпапку .build
          docker run --rm \
            -v "$(pwd)/qmk_firmware:/qmk_firmware" \
            qmkfm/qmk_cli \
            qmk compile -kb handwired/macropad -km vial

      - name: Check Where The File Is
        run: |
          # Проверим, что компилятор реально родил файлы и куда именно
          ls -la qmk_firmware/.build/ || echo "Папка .build пустая!"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vial-firmware
          path: qmk_firmware/.build/*
          if-no-files-found: error
