name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          cd qmk_firmware
          qmk setup -y
          
          # ПРИНУДИТЕЛЬНОЕ УКАЗАНИЕ КОНТРОЛЛЕРА
          # Мы прямо в команде make говорим: "используй RP2040"
          make handwired/macropad:vial MCU=rp2040
          
          # Сразу после сборки выводим всё, что лежит в папке .build
          echo "--- СОДЕРЖИМОЕ ПАПКИ .BUILD ---"
          find .build -name "*.uf2" -o -name "*.hex" -o -name "*.bin" 2>/dev/null || echo "Папка .build пуста"

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: final-firmware-package
          path: |
            qmk_firmware/.build/*.uf2
            qmk_firmware/.build/*.hex
            qmk_firmware/keyboards/handwired/macropad/*.uf2
