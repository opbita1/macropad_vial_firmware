name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - name: Checkout QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          submodules: recursive
          path: qmk_firmware

      - name: Checkout My Keyboard
        uses: actions/checkout@v4
        with:
          path: my_keyboard

      - name: Build Firmware
        run: |
          mkdir -p qmk_firmware/keyboards/handwired/macropad
          cp -rf my_keyboard/keyboards/handwired/macropad/* qmk_firmware/keyboards/handwired/macropad/
          
          cd qmk_firmware
          qmk setup -y
          # Запускаем сборку и если она падает — выводим лог
          make handwired/macropad:vial > build.log 2>&1 || { cat build.log; exit 1; }
          
          echo "--- ПОИСК ФАЙЛОВ СБОРКИ ---"
          find . -name "*.uf2" -o -name "*.hex" -o -name "*.bin"
          
          # Копируем всё найденное в корень, чтобы забрать артефактом
          find . -name "*.uf2" -exec cp {} . \;
          find . -name "*.hex" -exec cp {} . \;
          find . -name "*.bin" -exec cp {} . \;

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: all-build-files
          path: |
            qmk_firmware/*.uf2
            qmk_firmware/*.hex
            qmk_firmware/*.bin
