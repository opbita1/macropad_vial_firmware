name: Build Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Compile
        run: |
          # Используем команду без CD, указывая путь к твоему текущему репозиторию как к месту с клавиатурами
          # Мы говорим QMK, что текущая папка (GITHUB_WORKSPACE) — это и есть его рабочее дерево
          qmk compile -kb handwired/macropad -km vial
